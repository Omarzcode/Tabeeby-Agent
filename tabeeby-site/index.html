<style>
:root{color-scheme:light dark;--bg:#f3f5f2;--sf:#fff;--ink:#14231f;--mut:#5b6c66;--line:#d9e1dc;--pr:#0b5d4f;--prt:#e4f0ec;--on:#fff;--dg:#c8283a}
@media (prefers-color-scheme:dark){:root{--bg:#0b1411;--sf:#111d19;--ink:#e7f0ec;--mut:#8fa39b;--line:#223530;--pr:#58cdaf;--prt:#15302a;--on:#06241c;--dg:#b3202f}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.75;height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
.bar{border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo svg{width:30px;height:30px;flex:none}
.logo b{font-size:22px;font-weight:700;line-height:1}
.status{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:7px}
.status:before{content:"";width:8px;height:8px;border-radius:50%;background:#1f9d6a}
@media (max-width:440px){.status{display:none}}
.acts{display:flex;gap:8px}
.pill{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 16px;font-size:15px;transition:border-color .15s}
.pill:hover:not(:disabled){border-color:var(--pr);color:var(--pr)}
.pill:disabled{opacity:.45;cursor:default}
main{flex:1;overflow-y:auto;padding:24px 16px 16px;scroll-padding-top:12px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.hero{padding:6vh 0 8px}
.hero h1{font-size:clamp(38px,8vw,66px);font-weight:700;line-height:1.2}
.hero h2{font-size:clamp(18px,3vw,22px);font-weight:400;color:var(--mut);margin-top:10px}
.chips{margin-top:34px;border-top:1px solid var(--line)}
.chip{display:flex;width:100%;align-items:center;justify-content:space-between;gap:14px;padding:15px 2px;background:none;border:0;border-bottom:1px solid var(--line);text-align:start;transition:color .15s,padding .15s}
.chip svg{flex:none;opacity:.55}
.chip:hover{color:var(--pr);padding-inline-start:8px}
[dir=rtl] .chip svg{transform:scaleX(-1)}
.row{display:flex;gap:12px;align-items:flex-start;animation:in .3s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.av{flex:none;width:28px;height:28px;margin-top:3px}.av svg{width:100%;height:100%}
.msg{flex:1;min-width:0;overflow-wrap:anywhere}
.row.u{justify-content:flex-end}
.u .msg{flex:none;max-width:min(86%,560px);background:var(--pr);color:var(--on);padding:10px 18px;border-radius:20px;border-end-end-radius:6px;white-space:pre-wrap;line-height:1.65}
.msg p{margin:.5em 0}.msg p:first-child{margin-top:0}
.msg ul,.msg ol{padding-inline-start:1.4em;margin:.5em 0}.msg li{margin:.2em 0}
.msg h1,.msg h2,.msg h3{font-size:1.05em;font-weight:700;margin:1em 0 .2em}
.msg strong{font-weight:700}
.msg hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.msg a{color:var(--pr);text-decoration:underline;text-underline-offset:3px}
.alert{background:var(--dg);color:#fff;border-radius:16px;padding:16px 18px;font-weight:700;font-size:19px;line-height:1.5;animation:in .3s}
.alert a{display:inline-flex;background:#fff;color:var(--dg);text-decoration:none;border-radius:999px;padding:6px 18px;margin-top:12px;margin-inline-end:8px;font-size:16px}
.dots{display:inline-flex;gap:5px;padding:8px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--pr);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-5px);opacity:.4}}
.hint{color:var(--mut);font-size:14px}
.retry{border:1px solid var(--dg);color:var(--dg);background:none;border-radius:999px;padding:0 14px;margin-inline-start:10px;font-size:14px}
.cards{display:grid;gap:12px;margin:14px 0}
.doc{display:grid;grid-template-columns:1fr auto;background:var(--sf);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.doc .main{padding:14px 18px;min-width:0}
.doc b{display:block;font-size:18px;line-height:1.45}
.doc .spec{color:var(--pr);font-weight:600;font-size:15px}
.doc .sub{color:var(--mut);font-size:14px;line-height:1.55;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.doc .meta{display:flex;flex-wrap:wrap;gap:2px 16px;margin-top:8px;font-size:14px;color:var(--mut)}
.doc .meta span{display:inline-flex;align-items:center;gap:6px}
.stub{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-width:132px;padding:14px 18px;background:var(--prt);border-inline-start:2px dashed var(--line)}
.stub:before,.stub:after{content:"";position:absolute;inset-inline-start:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.stub:before{top:-8px}.stub:after{bottom:-8px}
.fee{font-size:26px;font-weight:700;line-height:1.1;text-align:center}
.fee small{display:block;font-size:13px;font-weight:500;color:var(--mut)}
.msg a.book{background:var(--pr);color:var(--on);text-decoration:none;font-weight:600;font-size:15px;border-radius:999px;padding:5px 22px}
@media (max-width:520px){
 .doc{grid-template-columns:1fr}
 .stub{flex-direction:row;justify-content:space-between;border-inline-start:0;border-top:2px dashed var(--line)}
 .fee small{display:inline;margin-inline-start:4px}.fee{font-size:22px}
 .stub:before,.stub:after{top:-9px;bottom:auto;inset-inline-start:auto}
 .stub:before{inset-inline-start:-8px}.stub:after{inset-inline-end:-8px}
}
.why{border-top:1px solid var(--line);margin-top:8px;padding-top:4px}
.why summary{cursor:pointer;color:var(--pr);font-weight:600;padding:6px 0}
.dock{padding:6px 16px calc(10px + env(safe-area-inset-bottom,0px))}
form{max-width:760px;margin:0 auto;background:var(--sf);border:1.5px solid var(--line);border-radius:24px;padding:6px;padding-inline-start:20px;display:flex;gap:8px;align-items:flex-end;transition:border-color .15s}
form:focus-within{border-color:var(--pr)}
textarea{flex:1;font:inherit;color:var(--ink);background:none;border:0;resize:none;max-height:140px;padding:9px 0;outline:0}
textarea::placeholder{color:var(--mut)}
.send{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--pr);color:var(--on);display:grid;place-items:center;transition:opacity .15s}
.send:disabled{opacity:.4;cursor:default}
.cnt{max-width:760px;margin:4px auto 0;padding-inline:14px;font-size:12.5px;color:var(--mut);text-align:end}.cnt.over{color:var(--dg)}
.note{max-width:760px;margin:8px auto 0;font-size:12.5px;color:var(--mut);text-align:center;line-height:1.5}
.pill{min-height:44px;padding:0 18px}
.cnt,.note{font-size:14px}
.off{background:var(--dg);color:#fff;text-align:center;font-size:14px;padding:6px 12px}
.qr{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.qr button{min-height:44px;padding:0 18px;border:1px solid var(--line);background:var(--sf);border-radius:999px;font-size:15px;transition:border-color .15s,color .15s}
.qr button:hover{border-color:var(--pr);color:var(--pr)}
.send.stop{background:var(--dg);color:#fff}
.msg a.book,.alert a{display:inline-flex;align-items:center;min-height:44px}
.why summary{padding:10px 0}
.retry{min-height:36px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
const API = "https://tabeeby-agent.fastapicloud.dev";
const STR = {
 ar:{brand:"طبيبي",status:"متاح الآن",h1:"حاسس بإيه؟",h2:"ونوصّلك للدكتور المناسب",reset:"محادثة جديدة",note:"طبيبي بيساعدك تلاقي الدكتور المناسب، مش تشخيص. في الطوارئ اتصل بـ 123.",ph:"اكتب هنا...",btn:"EN",book:"احجز",why:"ليه الدكاترة دول؟",title:"طبيبي · دليلك للدكتور المناسب في مصر",desc:"طبيبي يساعدك تلاقي الدكتور المناسب في مصر ويوصّلك لحجز مع دكاترة حقيقيين.",stop:"إيقاف",cancel:"تم إلغاء الطلب.",offline:"مفيش اتصال بالإنترنت.",
  q:[{l:"أرخص",p:"فيه حد أرخص؟"},{l:"أقرب",p:"فيه حد أقرب ليا؟"},{l:"دكتورة",p:"ممكن دكتورة ست؟"},{l:"انتظار أقل",p:"مين فيهم وقت الانتظار عنده أقل؟"}],retry:"حاول تاني",alert:"طوارئ: اتصل بالإسعاف 123 فورًا",none:"مفيش رد. جرّب تكتب بشكل تاني.",err:"تعذّر الاتصال بالخدمة. حاول مرة أخرى.",e500:"حصل خطأ. جرّب تاني.",e503:"الخدمة بتشتغل دلوقتي. جرّب بعد ثواني.",rate:"رسائل كتير. استنى {n} ثانية.",long:"الرسالة لازم تكون من حرف لـ 4000 حرف.",timeout:"الرد اتأخر. جرّب تاني.",wait:"بندوّر على الدكاترة، ثواني...",fee:"جنيه",rev:"تقييم",wt:"دقيقة انتظار",

 en:{brand:"Tabeeby",status:"Online",h1:"Tell us how you feel",h2:"We find the right doctor for you",reset:"New chat",note:"Tabeeby helps you find the right doctor. It is not a diagnosis. In an emergency call 123. Your messages are sent to Tabeeby's server and kept temporarily (up to 6 hours after your last message).",ph:"Type here...",btn:"عربي",book:"Book",why:"Why these doctors",title:"Tabeeby · Find the right doctor in Egypt",desc:"Tabeeby helps you find the right doctor in Egypt and book with real doctors.",stop:"Stop",cancel:"Request cancelled.",offline:"You are offline.",
  q:[{l:"Cheaper",p:"Is there anyone cheaper?"},{l:"Closer",p:"Is there anyone closer to me?"},{l:"Female doctor",p:"Can I see a female doctor?"},{l:"Shorter wait",p:"Who has the shortest waiting time?"}],retry:"Retry",alert:"Emergency: call 123 now",none:"No answer was returned. Try rephrasing.",err:"Could not reach Tabeeby. Check your connection and try again.",e500:"Something went wrong. Please try again.",e503:"The service is starting. Try again in a few seconds.",rate:"Too many messages. Please wait {n} seconds.",long:"Messages must be 1 to 4,000 characters.",timeout:"The reply took too long. Please try again.",wait:"Searching doctors, a few seconds...",fee:"EGP",rev:"reviews",wt:"min wait",

};
let lang = "ar";
try{ lang = localStorage.getItem("lang") || "ar"; }catch(e){}
const t = k => STR[lang][k];
const $ = id => document.getElementById(id);
const log = $("log"), input = $("input"), send = $("send");
let sid = null; try{ sid = localStorage.getItem("tabeeby_session"); }catch(e){}
let busy = false, typing = true, demoRun = 0, ctrl = null;
const INTRO = log.innerHTML;
const MARK = '<svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--pr)"/><path d="M5 17h5l3-7 5 13 3-6h6" fill="none" stroke="var(--on)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ARROW = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const ic = d => '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
const ICO = { pin: ic('<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>'), rev: ic('<path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.2A8 8 0 1 1 21 12z"/>'), clock: ic('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>') };
const SENDI = send.innerHTML;
const STOPI = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
function setBusy(b){ busy = b; $("reset").disabled = b; send.disabled = b && !ctrl; }
function setStop(on){ send.classList.toggle("stop", on); send.setAttribute("aria-label", on ? t("stop") : "Send"); send.innerHTML = on ? STOPI : SENDI; send.disabled = busy && !on; }
const CK = "tabeeby_docs"; // doctor cards are cached per reply, because GET /chat returns text only
function cacheGet(){ try{ const c = JSON.parse(localStorage.getItem(CK) || "null"); return c && c.sid===sid && Array.isArray(c.items) ? c.items : []; }catch(e){ return []; } }
function cachePush(d){ if(!sid) return; try{ const items = cacheGet(); items.push({ doctors: Array.isArray(d.doctors) ? d.doctors : [], emergency: !!d.emergency, emergency_numbers: d.emergency_numbers || null }); localStorage.setItem(CK, JSON.stringify({ sid, items: items.slice(-10) })); }catch(e){} }
function cacheClear(){ try{ localStorage.removeItem(CK); }catch(e){} }
function saveSid(){ try{ sid ? localStorage.setItem("tabeeby_session", sid) : localStorage.removeItem("tabeeby_session"); }catch(e){} }

function esc(x){ return String(x).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function md(x){ // fallback if the markdown libraries fail to load
  let h = esc(x);
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  h = h.replace(/(^|[\s>])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  return h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/^\s*[*-]\s+/gm, "• ").replace(/\n/g, "<br>");
}
let hooked = false;
function render(x){
  try{
    if(window.marked && window.DOMPurify){
      if(!hooked){ hooked = true; DOMPurify.addHook("afterSanitizeAttributes", n => { if(n.tagName==="A"){ n.setAttribute("target","_blank"); n.setAttribute("rel","noopener noreferrer"); } }); }
      return DOMPurify.sanitize(marked.parse(x, {breaks:true}));
    }
  }catch(e){}
  return md(x);
}
function cards(ds){
  if(!Array.isArray(ds) || !ds.length) return "";
  return '<div class="cards">' + ds.map(d => {
    const m = [];
    if(d.address) m.push(ICO.pin + esc(d.address));
    const rc = Number(d.reviews_count); if(rc > 0 && isFinite(rc)) m.push(ICO.rev + Math.round(rc) + " " + t("rev"));
    const wt = Number(d.waiting_time_min); if(d.waiting_time_min != null && isFinite(wt)) m.push(ICO.clock + Math.round(wt) + " " + t("wt"));
    const fee = Number(d.fee), hasFee = d.fee != null && isFinite(fee);
    const url = /^https:\/\//.test(d.profile_url || "") ? d.profile_url : "";
    const stub = (hasFee || url) ? '<div class="stub">' + (hasFee ? '<span class="fee">' + Math.round(fee) + '<small>' + t("fee") + '</small></span>' : "") + (url ? '<a class="book" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + t("book") + '</a>' : "") + '</div>' : "";

}
function body(d){ // advice first, then doctor cards, then the full per-doctor details
  const txt = d.response || t("none"), ds = d.doctors;
  if(Array.isArray(ds) && ds.length){
    const k = txt.search(/^\s*(?:[-*•]\s+)?(?:\*\*)?(?:1|١)\s*[.)\-]/m);
    if(k > 0) return render(txt.slice(0,k).trim()) + cards(ds) + '<details class="why"><summary>' + esc(t("why")) + '</summary>' + render(txt.slice(k)) + '</details>';
  }
  return render(txt) + cards(ds);
}
function qr(d){ // follow-up quick replies, shown under the newest answer that has doctors
  if(d.emergency || !Array.isArray(d.doctors) || !d.doctors.length) return "";
  const L = STR[d.language] ? d.language : lang;
  return '<div class="qr">' + STR[L].q.map(x => '<button type="button" data-p="' + esc(x.p) + '">' + esc(x.l) + '</button>').join("") + '</div>';
}
function showAlert(d){
  const nums = d.emergency_numbers ? Object.entries(d.emergency_numbers).map(([k,v]) => '<a href="tel:' + esc(String(v).replace(/[^\d+]/g,"")) + '">' + esc(k) + " " + esc(v) + '</a>').join("") : "";
  add("alert", "<div>" + esc(t("alert")) + "</div>" + nums);
}
function add(kind, html){
  const r = document.createElement("div");
  if(kind==="alert"){ r.className = "alert"; r.dir = "auto"; r.setAttribute("role","alert"); r.innerHTML = html; }
  else{ r.className = "row" + (kind==="user" ? " u" : "");
    r.innerHTML = (kind==="user" ? "" : '<div class="av" aria-hidden="true">' + MARK + '</div>') + '<div class="msg" dir="auto">' + html + '</div>'; }
  const prev = log.lastElementChild; log.appendChild(r); const m = $("main");
  const dots = html.startsWith('<span class="dots"'), afterAlert = prev && prev.classList.contains("alert");
  if(kind==="alert" || (kind==="bot" && !dots && !afterAlert)) r.scrollIntoView({block:"start"}); else if(!afterAlert) m.scrollTop = m.scrollHeight;
  return r;
}
async function ask(text, retry, keep){
  if(busy || !text.trim()) return;
  if(text.length > 4000){ add("bot", esc(t("long"))); return; }
  typing = false; demoRun++; $("intro")?.remove(); log.querySelectorAll(".qr").forEach(e => e.remove());
  ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort("timeout"), 100000);
  setBusy(true); setStop(true);
  if(!retry) add("user", esc(text));
  if(!retry && !keep){ input.value = ""; input.style.height = "auto"; $("cnt").hidden = true; } // retries and chips keep the draft
  const wait = add("bot", '<span class="dots" aria-label="Thinking"><i></i><i></i><i></i></span>');
  const hint = setTimeout(() => wait.querySelector(".msg")?.insertAdjacentHTML("beforeend", '<div class="hint">' + esc(t("wait")) + '</div>'), 8000);
  let cool = 0;
  try{
    if(!navigator.onLine) throw {msg: t("offline")};
    const r = await fetch(API + "/chat", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(sid ? { prompt:text, session_id:sid } : { prompt:text }),
      signal: ctrl.signal });
    if(r.status===429){ cool = parseInt(r.headers.get("Retry-After") || "30", 10) || 30; throw {msg: t("rate").replace("{n}", cool)}; }
    if(r.status===422) throw {msg: t("long")};
    if(r.status===503) throw {msg: t("e503")};
    if(!r.ok) throw {msg: t("e500")};
    const d = await r.json(); sid = d.session_id || sid; saveSid(); wait.remove();
    if(d.emergency) showAlert(d);
    cachePush(d);
    const row = add("bot", body(d) + qr(d));
    if(d.direction) row.querySelector(".msg").dir = d.direction;
  }catch(e){
    wait.remove();
    const er = add("bot", esc(e && e.msg ? e.msg : (e==="timeout" ? t("timeout") : (e==="user" || (e && e.name==="AbortError")) ? t("cancel") : !navigator.onLine ? t("offline") : t("err"))) + '<button class="retry" type="button">' + esc(t("retry")) + '</button>');
    er.querySelector(".retry").onclick = () => { if(busy) return; er.remove(); ask(text, true); };
  }
  clearTimeout(hint); clearTimeout(timer); ctrl = null; setStop(false);
  if(cool){
    let n = cool; input.placeholder = t("rate").replace("{n}", n);
    const iv = setInterval(() => { n--; if(n > 0){ input.placeholder = t("rate").replace("{n}", n); return; } clearInterval(iv); input.placeholder = t("ph"); setBusy(false); }, 1000);
  } else { setBusy(false); input.focus(); }
}
function applyLang(){
  const d = document.documentElement; d.lang = lang; d.dir = lang==="ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  $("lang").textContent = t("btn"); document.title = t("title"); document.querySelector("meta[name=description]")?.setAttribute("content", t("desc")); input.placeholder = t("ph");
  try{ localStorage.setItem("lang", lang); }catch(e){}
  const c = $("chips");
  if(c){ c.innerHTML = ""; t("s").forEach(q => { const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.innerHTML = "<span></span>" + ARROW; b.firstChild.textContent = q; b.firstChild.dir = "auto"; b.onclick = () => ask(q, false, true); c.appendChild(b); }); }
  typing = true; demo();
}
$("lang").onclick = () => { lang = lang==="ar" ? "en" : "ar"; applyLang(); };
$("form").addEventListener("submit", e => { e.preventDefault(); if(ctrl){ ctrl.abort("user"); return; } ask(input.value); });
input.addEventListener("keydown", e => { if(e.key==="Enter" && !e.shiftKey && !e.isComposing && !matchMedia("(pointer:coarse)").matches){ e.preventDefault(); ask(input.value); } });
input.addEventListener("input", () => { typing = false; input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; const n = input.value.length, c = $("cnt"); c.hidden = n < 3000; c.textContent = n + " / 4000"; c.classList.toggle("over", n >= 4000); });
$("reset").onclick = () => {
  if(busy) return;
  if(sid) fetch(API + "/chat/" + encodeURIComponent(sid), { method:"DELETE" }).catch(()=>{});
  sid = null; saveSid(); cacheClear(); log.innerHTML = INTRO; input.value = ""; applyLang(); input.focus();
};
async function restore(){ // redraw the conversation after a page reload
  if(!sid) return;
  try{
    const r = await fetch(API + "/chat/" + encodeURIComponent(sid));
    if(!r.ok) throw 0;
    const d = await r.json();
    if(!d.messages || !d.messages.length) throw 0;
    typing = false; demoRun++; $("intro")?.remove(); input.placeholder = t("ph");
    const items = cacheGet(), asst = d.messages.filter(m => m.role !== "user").length; let a = 0;
    d.messages.forEach(m => {
      if(m.role === "user") return add("user", esc(m.content));
      const i = a++, c = items[items.length - (asst - i)] || {};
      if(c.emergency) showAlert(c);
      add("bot", body({ response: m.content, doctors: c.doctors }) + (i === asst - 1 ? qr({ doctors: c.doctors, emergency: c.emergency }) : ""));
    });
    $("main").scrollTop = $("main").scrollHeight;
  }catch(e){ if(e===0){ sid = null; saveSid(); } }
}
function demo(){ input.placeholder = t("ph"); } // static placeholder, no animated examples
log.addEventListener("click", e => { const b = e.target.closest(".qr button"); if(b) ask(b.dataset.p, false, true); });
function net(){ $("off").hidden = navigator.onLine; }
addEventListener("online", net); addEventListener("offline", net); net();
applyLang(); document.addEventListener("DOMContentLoaded", restore);
</script>
