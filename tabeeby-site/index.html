<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tabeeby طبيبي - Find the right doctor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3fb;--ink:#0f1b33;--muted:#5a6a86;--glass:rgba(255,255,255,.62);--glass2:rgba(255,255,255,.85);--line:rgba(15,27,51,.1);--g1:#12b5c4;--g2:#6366f1;--grad:linear-gradient(135deg,var(--g1),var(--g2));--danger:#d6283d;--dbg:rgba(214,40,61,.1);--a1:#7dd3fc;--a2:#c4b5fd;--a3:#99f6e4;--sh:0 10px 40px rgba(40,60,120,.14)}
@media (prefers-color-scheme:dark){:root{--bg:#070d1c;--ink:#e8eefc;--muted:#8d9bbb;--glass:rgba(22,32,60,.55);--glass2:rgba(26,38,70,.85);--line:rgba(255,255,255,.1);--danger:#ff8594;--dbg:rgba(255,80,100,.14);--a1:#0e7490;--a2:#4338ca;--a3:#0f766e;--sh:0 10px 40px rgba(0,0,0,.4)}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Cairo,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.65;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden}
.aurora i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.75;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--a1);top:-20vmax;left:-10vmax}
.aurora i:nth-child(2){background:var(--a2);top:10vmax;right:-20vmax;animation-delay:-7s}
.aurora i:nth-child(3){background:var(--a3);bottom:-25vmax;left:20vmax;animation-delay:-14s}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.15)}}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--g1);outline-offset:2px}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);box-shadow:var(--sh)}
.bar{margin:14px auto 0;width:min(920px,calc(100% - 24px));border-radius:999px;padding:8px 10px;padding-inline-start:22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;font-size:18px}
.logo b{font-size:22px;font-weight:800}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status:before{content:"";width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.2)}
.pill{background:var(--glass2);border:1px solid var(--line);border-radius:999px;padding:5px 16px;font-size:15px}
.pill:hover{border-color:var(--g1)}
main{flex:1;overflow-y:auto;padding:20px 14px 12px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.hero{padding:6vh 0 4px;text-align:center}
.hero h1{font-size:clamp(34px,7vw,60px);font-weight:800;line-height:1.2;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h2{font-size:clamp(18px,3.4vw,26px);font-weight:600;color:var(--muted);margin-top:8px}
.facts{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:22px 0 6px}
.facts span{border-radius:999px;padding:5px 14px;font-size:14px;color:var(--muted)}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:22px;text-align:start}
.chip{border-radius:18px;padding:14px 16px;transition:transform .2s,border-color .2s}
.chip:hover{transform:translateY(-3px);border-color:var(--g1)}
.row{display:flex;gap:10px;align-items:flex-start;animation:in .35s ease-out}
.row.u{justify-content:flex-end}.acts{display:flex;gap:8px}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.av{flex:none;width:34px;height:34px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-size:17px}
.msg{max-width:min(86%,620px);padding:12px 18px;border-radius:20px;overflow-wrap:anywhere}
.bot .msg,.row:not(.u) .msg{background:var(--glass2);border:1px solid var(--line);box-shadow:var(--sh)}
.u .msg{background:var(--grad);color:#fff;box-shadow:0 8px 24px rgba(99,102,241,.35)}
.msg a{color:var(--g2);font-weight:600;text-underline-offset:3px}
.msg a.book{display:inline-block;background:var(--grad);color:#fff;text-decoration:none;border-radius:999px;padding:2px 16px;margin:4px 0;font-size:15px}
.alert{background:var(--dbg);color:var(--danger);border:2px solid var(--danger);border-radius:18px;padding:12px 18px;font-weight:800;animation:in .35s}
.dots{display:inline-flex;gap:5px;padding:6px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--g1);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-5px);opacity:.4}}
.dock{padding:6px 14px calc(10px + env(safe-area-inset-bottom,0px))}
form{max-width:760px;margin:0 auto;border-radius:26px;padding:8px;padding-inline-start:20px;display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;font:inherit;color:var(--ink);background:none;border:0;resize:none;max-height:140px;padding:8px 0;outline:0}
textarea::placeholder{color:var(--muted)}
.send{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--grad);color:#fff;display:grid;place-items:center;transition:transform .2s}
.send:hover{transform:scale(1.07)}.send:disabled{opacity:.5;transform:none;cursor:default}
.note{max-width:760px;margin:8px auto 0;font-size:12.5px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.u .msg{white-space:pre-wrap}
.msg p{margin:.4em 0}.msg ul,.msg ol{padding-inline-start:1.3em;margin:.4em 0}
.hint{color:var(--muted);font-size:14px}
.cards{display:grid;gap:10px;margin-top:12px}
.doc{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--glass)}
.doc b{display:block}.doc small{color:var(--muted)}
.doc .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;margin:6px 0 10px}
.alert a{display:inline-block;background:var(--danger);color:#fff;text-decoration:none;border-radius:999px;padding:2px 14px;margin:6px 8px 0 0}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="bar glass">
  <div class="logo"><div class="mark">🩺</div><b>طبيبي</b><span class="status" data-i18n="status"></span></div>
  <div class="acts"><button class="pill" id="lang" type="button" aria-label="Switch language">EN</button><button class="pill" id="reset" type="button" data-i18n="reset"></button></div>
</header>
<main id="main"><div class="wrap" id="log">
  <section class="hero" id="intro">
    <h1 data-i18n="h1"></h1>
    <h2 data-i18n="h2"></h2>
  </section>
</div></main>
<div class="dock">
  <form id="form" class="glass">
    <textarea id="input" rows="1" dir="auto" aria-label="Message" maxlength="4000"></textarea>
    <button class="send" id="send" type="submit" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </form>
  <p class="note" data-i18n="note"></p>
</div>
<script>
const API = "https://tabeeby-agent.fastapicloud.dev";
const STR = {
 ar:{status:"طبيبي · متاح الآن",h1:"حاسس بإيه",h2:"ونوصّلك للدكتور المناسب",reset:"محادثة جديدة",note:"طبيبي بيساعدك تلاقي الدكتور المناسب، مش تشخيص. في الطوارئ اتصل بـ 123.",ph:"اكتب هنا...",btn:"EN",book:"احجز",alert:"🚨 طوارئ: اتصل بالإسعاف 123 فورًا",none:"مفيش رد. جرّب تكتب بشكل تاني.",err:"تعذّر الاتصال بالخدمة. حاول مرة أخرى.",e500:"حصل خطأ. جرّب تاني.",e503:"الخدمة بتشتغل دلوقتي. جرّب بعد ثواني.",rate:"رسائل كتير. استنى {n} ثانية.",long:"الرسالة لازم تكون من حرف لـ 4000 حرف.",timeout:"الرد اتأخر. جرّب تاني.",wait:"بندوّر على الدكاترة، ثواني...",fee:"جنيه",rev:"تقييم",wt:"دقيقة انتظار",
  s:["ضرسي بيوجعني جامد وانا في المعادي، ميزانيتي 400","عندي صداع ودوخة بقالي تلات أيام","محتاج دكتور أطفال في مدينة نصر بأقل من 300","تأخر حمل، محتاجة دكتورة كويسة"]},
 en:{status:"Tabeeby · Online",h1:"Tell us how you feel",h2:"We find the right doctor for you",reset:"New chat",note:"Tabeeby helps you find the right doctor. It is not a diagnosis. In an emergency call 123.",ph:"Type here...",btn:"عربي",book:"Book",alert:"🚨 Emergency: call 123 now",none:"No answer was returned. Try rephrasing.",err:"Could not reach Tabeeby. Check your connection and try again.",e500:"Something went wrong. Please try again.",e503:"The service is starting. Try again in a few seconds.",rate:"Too many messages. Please wait {n} seconds.",long:"Messages must be 1 to 4,000 characters.",timeout:"The reply took too long. Please try again.",wait:"Searching doctors, a few seconds...",fee:"EGP",rev:"reviews",wt:"min wait",
  s:["I have a bad toothache, I live in Maadi, budget 400","Headache and dizziness for three days","I need a pediatrician in Nasr City under 300 EGP","Trying to conceive for a year, need a good specialist"]}
};
let lang = "ar";
try{ lang = localStorage.getItem("lang") || "ar"; }catch(e){}
const t = k => STR[lang][k];
const $ = id => document.getElementById(id);
const log = $("log"), input = $("input"), send = $("send");
let sid = null, busy = false, typing = true, demoRun = 0;

function esc(x){ return String(x).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function md(x){ // fallback if the markdown libraries fail to load
  let h = esc(x);
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  h = h.replace(/(^|[\s>])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  return h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/^\s*[*-]\s+/gm, "• ").replace(/\n/g, "<br>");
}
let hooked = false;
function render(x){
  try{
    if(window.marked && window.DOMPurify){
      if(!hooked){ hooked = true; DOMPurify.addHook("afterSanitizeAttributes", n => { if(n.tagName==="A"){ n.setAttribute("target","_blank"); n.setAttribute("rel","noopener noreferrer"); } }); }
      return DOMPurify.sanitize(marked.parse(x, {breaks:true}));
    }
  }catch(e){}
  return md(x);
}
function cards(ds){
  if(!Array.isArray(ds) || !ds.length) return "";
  return '<div class="cards">' + ds.map(d => {
    const m = [];
    if(d.address) m.push("📍 " + esc(d.address));
    if(d.fee != null) m.push("💰 " + Math.round(d.fee) + " " + t("fee"));
    if(d.reviews_count) m.push("⭐ " + d.reviews_count + " " + t("rev"));
    if(d.waiting_time_min != null) m.push("⏱ " + Math.round(d.waiting_time_min) + " " + t("wt"));
    const url = /^https:\/\//.test(d.profile_url || "") ? d.profile_url : "";
    return '<div class="doc"><b>' + esc((d.name || "").replace(/\s+/g, " ").trim()) + '</b><small>' + esc(d.specialty || "") + '</small><div class="meta">' + m.map(v => "<span>" + v + "</span>").join("") + '</div>' + (url ? '<a class="book" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + t("book") + '</a>' : "") + '</div>';
  }).join("") + '</div>';
}
function add(kind, html){
  const r = document.createElement("div");
  if(kind==="alert"){ r.className = "alert"; r.dir = "auto"; r.innerHTML = html; }
  else{ r.className = "row" + (kind==="user" ? " u" : "");
    r.innerHTML = (kind==="user" ? "" : '<div class="av">🩺</div>') + '<div class="msg" dir="auto">' + html + '</div>'; }
  log.appendChild(r); $("main").scrollTop = $("main").scrollHeight; return r;
}
async function ask(text){
  if(busy || !text.trim()) return;
  if(text.length > 4000){ add("bot", esc(t("long"))); return; }
  typing = false; demoRun++; $("intro")?.remove(); busy = true; send.disabled = true;
  add("user", esc(text)); input.value = ""; input.style.height = "auto";
  const wait = add("bot", '<span class="dots" aria-label="Thinking"><i></i><i></i><i></i></span>');
  const hint = setTimeout(() => wait.querySelector(".msg")?.insertAdjacentHTML("beforeend", '<div class="hint">' + esc(t("wait")) + '</div>'), 8000);
  let cool = 0;
  try{
    const r = await fetch(API + "/chat", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(sid ? { prompt:text, session_id:sid } : { prompt:text }),
      signal: AbortSignal.timeout ? AbortSignal.timeout(100000) : undefined });
    if(r.status===429){ cool = parseInt(r.headers.get("Retry-After") || "30", 10) || 30; throw {msg: t("rate").replace("{n}", cool)}; }
    if(r.status===422) throw {msg: t("long")};
    if(r.status===503) throw {msg: t("e503")};
    if(!r.ok) throw {msg: t("e500")};
    const d = await r.json(); sid = d.session_id || sid; wait.remove();
    if(d.emergency){
      const nums = d.emergency_numbers ? Object.entries(d.emergency_numbers).map(([k,v]) => '<a href="tel:' + esc(String(v).replace(/[^\d+]/g,"")) + '">' + esc(k) + " " + esc(v) + '</a>').join("") : "";
      add("alert", "<div>" + esc(t("alert")) + "</div>" + nums);
    }
    const row = add("bot", render(d.response || t("none")) + cards(d.doctors));
    if(d.direction) row.querySelector(".msg").dir = d.direction;
  }catch(e){
    wait.remove();
    add("bot", esc(e && e.msg ? e.msg : (e && e.name==="TimeoutError" ? t("timeout") : t("err"))));
  }
  clearTimeout(hint);
  setTimeout(() => { busy = false; send.disabled = false; input.focus(); }, cool * 1000);
}
function applyLang(){
  const d = document.documentElement; d.lang = lang; d.dir = lang==="ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  $("lang").textContent = t("btn"); input.placeholder = t("ph");
  try{ localStorage.setItem("lang", lang); }catch(e){}
  typing = true; demo();
}
$("lang").onclick = () => { lang = lang==="ar" ? "en" : "ar"; applyLang(); };
$("form").addEventListener("submit", e => { e.preventDefault(); ask(input.value); });
input.addEventListener("keydown", e => { if(e.key==="Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); ask(input.value); } });
input.addEventListener("input", () => { typing = false; input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; });
$("reset").onclick = () => { if(sid) fetch(API + "/chat/" + encodeURIComponent(sid), { method:"DELETE" }).catch(()=>{}); location.reload(); };
// The placeholder types out example complaints until the visitor starts writing.
async function demo(){
  const run = ++demoRun;
  if(matchMedia("(prefers-reduced-motion:reduce)").matches || !$("intro")) return;
  let i = 0;
  while(typing && run===demoRun){
    const s = t("s")[i++ % 4];
    for(let k=1; k<=s.length && typing && run===demoRun; k++){ input.placeholder = s.slice(0,k); await new Promise(r=>setTimeout(r,45)); }
    await new Promise(r=>setTimeout(r,1800));
  }
}
applyLang();
</script>
</body>
</html>
